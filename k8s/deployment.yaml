apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-cicd-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloud-cicd-lab
  template:
    metadata:
      labels:
        app: cloud-cicd-lab
    spec:
      containers:
        - name: cloud-cicd-lab
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
